# config/fontspector.toml
# fontspector check profile for Sabas fonts.
# Run: fontspector --config config/fontspector.toml fonts/SabasUI-VF.ttf

[profile]
name = "sabas"

# Checks that must pass (hard failures)
[overrides]
# hhea must mirror sTypo* (§4.2)
"com.google.fonts/check/hhea" = "FAIL"
"com.google.fonts/check/os2_metrics_match_hhea" = "FAIL"
# STAT must have AxisValues (§13)
"com.google.fonts/check/stat" = "FAIL"
"com.google.fonts/check/stat_has_axis_value_tables" = "FAIL"
# gasp required for TTF (§4.2)
"com.google.fonts/check/gasp" = "FAIL"
# OFL required
"com.google.fonts/check/license/OFL_copyright" = "FAIL"

# Checks downgraded to WARN (known deviations with waivers)
# Add waiver entries to docs/waivers.md when downgrading here.
